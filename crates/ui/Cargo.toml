[package]
name = "sharescreen-ui"
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "GPUI desktop UI for Sharescreen"

[[bin]]
name = "sharescreen"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
unicode-segmentation = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sharescreen-core = { path = "../core" }
sharescreen-config = { path = "../config" }
sharescreen-capture = { path = "../capture" }
sharescreen-audio = { path = "../audio" }
sharescreen-call = { path = "../call" }
sharescreen-network = { path = "../network" }
