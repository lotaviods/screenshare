[package]
name = "sharescreen-native-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native GPU capture/encode/decode primitives for Sharescreen"

[dependencies]
sharescreen-core = { path = "../core" }

thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "avfilter", "swresample", "swscale"] }
libc = "0.2"
pipewire = "0.10"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
ffmpeg-sys-next = { version = "9", default-features = false, features = ["avcodec", "swresample", "swscale"] }

[dev-dependencies]
tempfile = "3"
