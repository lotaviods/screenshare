[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/native-media",
    "crates/capture",
    "crates/audio",
    "crates/webrtc",
    "crates/signaling",
    "crates/call",
    "crates/media",
    "crates/network",
    "crates/ui",
    "server",
]
default-members = ["crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

# `gpui` pulls in `zed-async-tar` → `xattr 0.2`, which still references the
# macOS-only `ENOATTR` constant on Linux. The vendored copy uses `ENODATA` there.
#
# `ffmpeg-sys-next` 9.0.1 includes the D3D11 hardware context header, which
# clang 23 rejects on Windows (`__tile` conflicts with `d3d11.h`). The vendored
# copy keeps that include out of the bindgen pass.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

# Release build for cross-compiling the Windows app from a non-Windows host.
#
# GPUI's build script only precompiles HLSL with fxc.exe when the *host* is
# Windows, so a `--release` cross-build fails on the missing shader bytes.
# Keeping debug assertions on makes GPUI compile its shaders at runtime with
# D3DCompile instead, which the Windows system d3dcompiler_47.dll provides.
[profile.winrelease]
inherits = "release"
debug-assertions = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util"] }
async-trait = "0.1"
directories = "6"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
